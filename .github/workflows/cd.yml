name: CD - Deploy Docs & Demo to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    # Only deploy commits that passed CI (or manual runs)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Site layout on https://<owner>.github.io/Seated/:
      #   /       documentation (VitePress, with its own live demo at /demo)
      #   /app/   Angular demo app (baseHref /Seated/app/)
      - name: Build documentation
        run: npx nx build docs
        env:
          DOCS_BASE: /Seated/

      - name: Build Angular demo
        run: npx nx build ng-demo --configuration=production

      - name: Assemble site
        run: |
          mkdir -p site
          cp -R docs/.vitepress/dist/. site/
          cp -R dist/apps/demo-angular/browser site/app

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
